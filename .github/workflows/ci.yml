name: CI Pipeline

permissions:
  contents: read

on:
  push:
  pull_request:

env:
  BUN_CACHE_PATHS: &bun-cache-paths |
    ~/.bun/install/cache
    node_modules
    dimp-auth/node_modules
    dimp-bot/node_modules
    dimp-dashboard/node_modules
    dimp-server/node_modules

jobs:
  # ---------- Preflight Checks ----------

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Verify bun.lock is up to date
        timeout-minutes: 3
        run: |
          if bun install --frozen-lockfile > /dev/null 2>&1; then
            echo "Lockfile OK ✔"
          else
            echo "::error::❌ bun.lock is out of sync with package.json. Please run 'bun install'."
            exit 1
          fi

  prettier:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Prettier formatting
        run: |
          if bun run format:check; then
            echo "Prettier formatting OK ✔"
          else
            echo "::error::❌ Prettier formatting check failed. Please run 'bun run format'."
            exit 1
          fi

  graphql-schema:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GraphQL schema
        run: bun run --cwd dimp-server generate-schema
      - name: Check GraphQL schema up to date
        run: |
          if git diff --exit-code dimp-server/schema.graphql > /dev/null 2>&1; then
            echo "GraphQL schema is up to date ✔"
          else
            echo "::error::❌ GraphQL schema is out of date. Please run 'bun run --cwd dimp-server generate-schema'."
            exit 1
          fi

  graphql-codegen:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run GraphQL codegen
        run: bun run --cwd dimp-bot codegen
      - name: Check GraphQL codegen up to date
        run: |
          if git diff --exit-code dimp-bot/src/graphql/generated.ts > /dev/null 2>&1; then
            echo "GraphQL codegen is up to date ✔"
          else
            echo "::error::❌ GraphQL codegen is out of date. Please run 'bun run --cwd dimp-bot codegen'."
            exit 1
          fi

  drizzle-migrations:
    needs: lockfile
    runs-on: ubuntu-latest
    env:
      # Dummy DATABASE_URL
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dimp-auth
            path: dimp-auth
          - name: dimp-server
            path: dimp-server
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Drizzle migrations for ${{ matrix.name }} are up to date
        run: |
          bun run --cwd ${{ matrix.path }} drizzle-kit generate

          git status --porcelain
          if test -z "$(git status --porcelain)"; then
            echo "Drizzle migrations for ${{ matrix.name }} are up to date ✔"
          else
            echo "::error::❌ Drizzle migrations for ${{ matrix.name }} are out of date. Please generate a migration using 'bun run --cwd ${{ matrix.path }} drizzle-kit generate --name <migration_name>'."
            exit 1
          fi

  lint:
    needs: lockfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            title: Auth
            path: dimp-auth
          - name: bot
            title: Bot
            path: dimp-bot
          - name: dashboard
            title: Dashboard
            path: dimp-dashboard
          - name: server
            title: Server
            path: dimp-server
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }} linter
        run: |
          if bun run --cwd ${{ matrix.path }} lint; then
            echo "${{ matrix.title }} linting passed ✔"
          else
            echo "::error::❌ ${{ matrix.title }} linting failed. Please fix the linting errors."
            exit 1
          fi

  dimp-server-tests:
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dimp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dimp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            title: Unit
          - name: integration
            title: Integration
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate test database
        if: matrix.name == 'integration'
        run: bun run --cwd dimp-server test:integration:db:migrate

      - name: Run dimp-server ${{ matrix.name }} tests
        run: |
          if bun run --cwd dimp-server test:${{ matrix.name }}; then
            echo "dimp-server ${{ matrix.title }} tests passed ✔"
          else
            echo "::error::❌ dimp-server ${{ matrix.title }} tests failed."
            exit 1
          fi

  dimp-bot-tests:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: *bun-cache-paths
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dimp-bot tests
        run: |
          if bun run --cwd dimp-bot test; then
            echo "dimp-bot tests passed ✔"
          else
            echo "::error::❌ dimp-bot tests failed."
            exit 1
          fi

  # ---------- Preflight Barrier ----------

  # TODO: add changed workspace detection
  preflight:
    needs:
      [
        lockfile,
        prettier,
        graphql-schema,
        graphql-codegen,
        drizzle-migrations,
        lint,
        dimp-bot-tests,
        dimp-server-tests,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Preflight checks passed
        run: |
          echo "All preflight checks passed ✔"
          echo "Proceeding to further jobs..."

  # ---------- Workspace CI Checks ----------
